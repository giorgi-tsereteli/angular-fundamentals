<div class="container">
  <div class="filters">
    <!-- Initially, click action was setting filter to a string value and later was used in the function to match the category -->
     <!-- Currently its using router links and function filters products depending on url parameters like /Heads -->
    <!-- <a class="button" (click)="filter = 'Heads'">Heads</a> -->
    <a routerLink="/catalog/Heads" class="button">Heads</a>
    <a routerLink="/catalog/Arms" class="button">Arms</a>
    <a routerLink="/catalog/Torsos" class="button">Torsos</a>
    <a routerLink="/catalog/Bases" class="button">Bases</a>
    <a [routerLink]="['/catalog', '']" class="button">All</a>
  </div>

  <ul class="products">
    <li class="product-item" *ngFor="let product of getFilteredProducts()">
      <bot-product-details [product]="product" (buy)="addToCart(product)"></bot-product-details>
    </li>
  </ul>
</div>
